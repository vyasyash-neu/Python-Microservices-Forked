server:
  port: 8006

spring:
  application:
    name: search-service

  elasticsearch:
    uris: http://localhost:9200

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health, info

# Product Service (source of truth for reconciliation)
product:
  service:
    url: http://localhost:8001

# Bidirectional reconciliation job — safety net for Kafka outages and ES drift
reconciliation:
  enabled: true
  interval:
    ms:  1800000 # DEFAULT 30 minutes (USE THIS VALUE FOR TESTING 30000)
  initial:
    delay:
      ms: 60000  # DEFAULT 60 seconds after startup (USE THIS VALUE FOR TESTING 10000)