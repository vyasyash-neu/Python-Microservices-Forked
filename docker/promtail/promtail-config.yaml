# ─────────────────────────────────────────────
# Scrapes Docker container logs → sends to Loki
# ─────────────────────────────────────────────
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Job 1: Docker container logs (existing)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream

  # Job 2: Host service logs (new — JSON files from /var/log/services)
  - job_name: services
    static_configs:
      - targets: [localhost]
        labels:
          job: services
          __path__: /var/log/services/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            timestamp: timestamp
      - labels:
          service:
          level: